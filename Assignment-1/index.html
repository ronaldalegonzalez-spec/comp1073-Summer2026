<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>See 'N' Say Story Maker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>
            <a href="https://www.ebay.ca/itm/318038011690?_skw=see+n+say+story+maker&itmmeta=01KV43E4TAVVPSESX3EZXGCP1E&hash=item4a0c8aef2a:g:13EAAeSwWpxpvVAp&itmprp=enc%3AAQALAAAA8GfYFPkwiKCW4ZNSs2u11xCmz%2FBiOAuR9G2ywqUnTXzlKbpj3%2FxPgJmQZGhREp66y%2FbljSn8L2EgqZuaTQ2Fe91T%2BA4uQ6Ok1xdS0nxK7%2FIo44S%2FqISIymPRfTJiKD%2BzeHzJ0RTnN8tgJo7w7qhckV2A%2BiLz845tb2ER2Tot93NsWHyJ7QcUwYd10dSdeMWQY08Ce%2B270n7NadvV5iHAyeA8ctpiLJodUGtg6ffhC6bATGILXDZdyalecqpqTeCLxqPHxVDLeuTK3Rimg1LfZ9AElURk1VUpAUb2lGKdhLw%2BalRYnR73jB8htuKb2%2BcN5g%3D%3D%7Ctkp%3ABk9SR6TNuIPZZw"
                alt="Buy the Book" class="page-title">See 'N' Say Story Maker</a>
        </h1>
    </header>

    <main class="story-maker-container">
        <p class="instructions">Click each button until you find the perfect words for your story!</p>

        <!-- Word selectors -->
        <section class="word-selectors">
            <button id="subject-btn" class="story-button">Character</button>

            <button id="action-btn" class="story-button">Action</button>

            <button id="description-btn" class="story-button">Description</button>

            <button id="object-btn" class="story-button">Object</button>

            <button id="location-btn" class="story-button">Place</button>
        </section>

        <!-- Controls -->
        <section class="controls">
            <button id="create-story-btn" class="control-button">Tell My Story</button>

            <!-- Extra features -->
            <button id="random-story-btn" class="control-button">Random Story</button>

            <button id="reset-btn" class="control-button">Reset</button>
        </section>

        <!-- Story output -->
        <section class="story-output-container">
            <h2>Your Story:</h2>
            <p id="story-output">Your story will appear here...</p>
        </section>
    </main>
</body>

</html>
