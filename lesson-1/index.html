<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>JavaScript Introduction | COMP1073 Client-Side JavaScript</title>
	<link rel="stylesheet" href="css/styles.css">
	<script src="js/script.js" defer></script>
	<!-- defer attribute se usa para hacer que el elemento cargue solo cuando la pagina ya se haya cargafo por completo, es decir, el script se ejecutará después de que el documento HTML haya sido completamente analizado. Esto es útil para evitar bloqueos en la carga de la página y mejorar el rendimiento, ya que el navegador no tiene que esperar a que se descargue y ejecute el script antes de continuar con la carga del resto del contenido. -->

</head>
<body>
	<h1>JavaScript Introduction</h1>
	<p>Hello, <em>teacher Scott</em>. This week's lesson is all about the basics of adding JavaScript to HTML and CSS.</p>
	
</body>
