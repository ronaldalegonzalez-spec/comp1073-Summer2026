<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pizza Maker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <div class="container">
        <h1>The Ron-Pizza Pizzeria</h1>

        <p class="subtitle">Build your perfect pizza!</p>

        <form id="pizzaForm">
            <fieldset>
                <legend>Customer Information</legend>

                <label for="customerName">Name</label>
                <input type="text" id="customerName">
                <label for="customerEmail">Email</label>
                <input type="text" id="customerEmail">
            </fieldset>

            <fieldset>
                <legend>Pizza Details</legend>

                <label for="pizzaSize">Size</label>
                <select id="pizzaSize">
                    <option value="">Select a size</option>

                    <option value="Small">Small</option>

                    <option value="Medium">Medium</option>

                    <option value="Large">Large</option>

                </select>

                <label for="crustType">Crust</label>
                <select id="crustType">
                    <option value="">Select a crust</option>

                    <option value="Classic">Classic</option>

                    <option value="Thin">Thin</option>

                    <option value="Stuffed">Stuffed</option>

                </select>
            </fieldset>

            <fieldset>
                <legend>Toppings</legend>
                <label>
                    <input type="checkbox" class= "topping" value="Pepperoni">Pepperoni</label>

                <label>
                    <input type="checkbox" class= "topping" value="Bacon">Bacon
                </label>

                <label>
                    <input type="checkbox" class= "topping" value="Mushrooms">Mushrooms
                </label>

                <label>
                    <input type="checkbox" class= "topping" value="Onions">Onions
                </label>

                <label>
                    <input type="checkbox" class= "topping" value="Olives">Olives
                </label>
            </fieldset>


            <fieldset>
                <legend>Delivery</legend>
                <label>
                    <input type="radio" name="delivery" value="Pickup">Pickup
                </label>

                <label>
                    <input type="radio" name="delivery" value="Delivery">Delivery
                </label>
            </fieldset>

            <fieldset>
                <legend>Special Instructions</legend>
                <textarea id="instructions" rows="4" placeholder="Anything else?"></textarea>
            </fieldset>

            <button type="submit">Order Pizza</button>
        </form>

        <section id="orderSummary">
            <h2>Your Order</h2>
            <p id="pizzaOutput"></p>
        </section>

        <footer>
            <p id="studentInfo"></p> <!-- I'll left it empty to fill it dynamically with JS -->
        </footer>
    </div>
</body>

</html>
